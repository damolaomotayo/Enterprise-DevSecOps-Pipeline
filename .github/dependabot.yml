# Automatic update pull requests: a pipeline that finds vulnerable dependencies
# should also help fix them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
